apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    email: dev.aman.guptaa@gmail.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod

    solvers:
      - http01:
          # Default solver — handles codeio.amangupta.work (no selector = catch-all)
          ingress:
            ingressClassName: nginx

      # DNS-01 solver — only used for names under ws.codeio.amangupta.work
      - selector:
          dnsZones:
            - "ws.codeio.amangupta.work"
        dns01:
          webhook:
            config:
              apiKeySecretRef:
                name: godaddy-api-key
                key: token
              production: true
              ttl: 600
            groupName: acme.codeio.amangupta.work
            solverName: godaddy
