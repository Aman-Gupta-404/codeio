apiVersion: v1
kind: ConfigMap
metadata:
  name: codeio-api-config
  namespace: codeio

# This is to store all the non-sensitive variables
data:
  NODE_ENV: "production"
  PORT: "3001"
  # k8s related configs
  K8S_CONFIG: "in-cluster" #val -> in-cluster | local
  K8S_CONTEXT: "codeio"
  K8S_NAMESPACE: "codeio"
  WORKER_IMAGE: "ghcr.io/aman-gupta-404/codeio-workspace-service:v1.0.0"
  WORKSPACE_SYNC_IMAGE: "ghcr.io/aman-gupta-404/codeio-sync-service:v1.0.0"
  WORKER_SERVICE_TYPE: "NodePort"
  STORAGE_CLASS: "civo-volume"
  WORKER_IMAGE_PULL_POLICY: "Always"
  # WORKER_IMAGE_PULL_POLICY: "IfNotPresent"
